# Mac/tmux/config/keybindings.conf
# Tmux 键位
#
# tmux 不会为重复绑定报错，后写的静默覆盖先写的。
# 因此本文件里每个「表 + 键」的组合只出现一次。
#
# 与旧配置相比的键位变更（都是被迫的，原因见各处注释）:
#   窗口切换   prefix C-h / C-l   ->  prefix C-p / C-n
#   关闭面板   M-x (无 prefix)    ->  prefix x
#   清屏       prefix C-l         ->  仍是 prefix C-l，但改为把 C-l 透传给 shell
#   禁用键位   prefix C-q         ->  F12 开关（旧的 unbind-key -a 是有去无回的死路）

###############################################################################
# 前缀键
###############################################################################

unbind C-b
set -g prefix C-a

# prefix + C-a 发送一个真正的 C-a 给应用（行首）
bind C-a send-prefix

###############################################################################
# 清理已废弃的旧键位
###############################################################################
# tmux 的 source-file 只会新增和覆盖绑定，不会清掉「配置里已经删掉」的那些。
# 所以 prefix + r 重载时，这几个旧键位会一直赖在运行中的 server 里，
# 必须显式 unbind。（unbind 一个本来就没绑的键是静默成功的，可以无条件写。）

unbind -n M-x   # 关闭面板已移到 prefix + x（无 prefix 的 M-x 会和 shell / nvim 撞车）
unbind C-q      # 旧的 `unbind-key -a` 有去无回，已被文件末尾的 F12 开关取代
unbind C-h      # 窗口切换已移到 C-p / C-n，C-hjkl 整组让给 vim-tmux-navigator
unbind C-s      # 旧的 resurrect 绑定指向不存在的 ~/.config/tmux/plugins，插件自己会绑
unbind C-r

###############################################################################
# 重载配置
###############################################################################

# 直接指向 dotfiles 里的真实路径，不依赖 ~/.tmux.conf 这个软链接是否还在
bind r source-file "$TMUX_DIR/tmux.conf" \; display "配置已重载!"

###############################################################################
# 会话管理
###############################################################################

# 上一个会话。旧配置把它绑在 Tab 上，但下面「窗口管理」里又把 Tab 绑成了
# last-window，后者静默覆盖了前者 —— 也就是说这个功能从来没生效过。
# 现在挪到 Shift-Tab，和 Tab(上一个窗口) 形成对照。
bind BTab switch-client -l

# 新建 / 重命名会话
bind N new-session
bind R command-prompt -I "#{session_name}" "rename-session '%%'"

# 删除当前会话。
# 靠 options.conf 里的 detach-on-destroy off 自动切到另一个会话，
# 不再需要 kill_current_session.sh 去手工挑下一个会话再切过去。
bind K confirm-before -p "删除会话 #{session_name}? (y/n)" kill-session

# 模糊切换会话 (sesh: 集成 zoxide，能直接跳到还没建会话的项目目录)
bind o display-popup -E -w 60% -h 60% 's=$(sesh list --icons --hide-duplicates | fzf --no-sort --ansi --height 100% --border none --prompt "sesh > "); [ -n "$s" ] && sesh connect "$s"'

# 按序号跳会话。序号和状态栏左侧显示的序号一致
# （两边都基于 `tmux list-sessions` 的默认排序）。
bind -n M-1 run-shell -b "$TMUX_DIR/scripts/switch_session_by_index.sh 1"
bind -n M-2 run-shell -b "$TMUX_DIR/scripts/switch_session_by_index.sh 2"
bind -n M-3 run-shell -b "$TMUX_DIR/scripts/switch_session_by_index.sh 3"
bind -n M-4 run-shell -b "$TMUX_DIR/scripts/switch_session_by_index.sh 4"
bind -n M-5 run-shell -b "$TMUX_DIR/scripts/switch_session_by_index.sh 5"
bind -n M-6 run-shell -b "$TMUX_DIR/scripts/switch_session_by_index.sh 6"
bind -n M-7 run-shell -b "$TMUX_DIR/scripts/switch_session_by_index.sh 7"
bind -n M-8 run-shell -b "$TMUX_DIR/scripts/switch_session_by_index.sh 8"
bind -n M-9 run-shell -b "$TMUX_DIR/scripts/switch_session_by_index.sh 9"

###############################################################################
# 窗口管理
###############################################################################

# 新建窗口 (保持当前路径)
bind c new-window -c "#{pane_current_path}"

# 关闭窗口 / 重命名
bind X confirm-before -p "关闭窗口 #W? (y/n)" kill-window
bind , command-prompt -I "#{window_name}" "rename-window '%%'"

# 上一个窗口
bind Tab last-window

# 窗口切换。
# 旧配置用 prefix C-h / C-l，但 C-l 在下面又被绑成了清屏，next-window 从未生效
# （你没察觉是因为 tmux-sensible 悄悄补了 C-n / C-p）。
# 现在 C-hjkl 整组让给 vim-tmux-navigator 做面板/nvim 无缝切换，
# 窗口切换正式落在 C-p / C-n 上 —— 也就是你其实一直在用的那组键。
bind -r C-p previous-window
bind -r C-n next-window

# 窗口重排序。
# swap-window -d 一条命令就能「移动窗口且焦点跟着走」，
# 旧写法的 `\; select-window -t ±1` 是多余的。
bind -r H swap-window -d -t -1
bind -r L swap-window -d -t +1

# 快速跳转到指定窗口
bind 0 select-window -t :0
bind 1 select-window -t :1
bind 2 select-window -t :2
bind 3 select-window -t :3
bind 4 select-window -t :4
bind 5 select-window -t :5
bind 6 select-window -t :6
bind 7 select-window -t :7
bind 8 select-window -t :8
bind 9 select-window -t :9

###############################################################################
# 面板管理
###############################################################################

# 分割 (保持当前路径)
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 面板切换 (vim 风格)。
# 日常请直接用无 prefix 的 C-hjkl（vim-tmux-navigator，在 nvim 分屏和 tmux 面板
# 之间无缝穿梭）。这组是它没装好时的兜底。
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 调整大小
bind -r M-h resize-pane -L 5
bind -r M-j resize-pane -D 5
bind -r M-k resize-pane -U 5
bind -r M-l resize-pane -R 5

bind -r C-M-h resize-pane -L 1
bind -r C-M-j resize-pane -D 1
bind -r C-M-k resize-pane -U 1
bind -r C-M-l resize-pane -R 1

# 面板交换
bind > swap-pane -D
bind < swap-pane -U

# 关闭面板。
# 旧配置绑在无 prefix 的 M-x 上，会和 shell 的 emacs 键位、nvim 里的 M-x 撞车。
bind x confirm-before -p "关闭面板 #P? (y/n)" kill-pane

# 最大化 / 还原
bind f resize-pane -Z

# 同步输入
bind S set-option synchronize-panes \; display "面板同步: #{?synchronize-panes,开启,关闭}"

###############################################################################
# 复制模式
###############################################################################

bind v copy-mode
bind p paste-buffer

# 这几条旧配置在 options.conf 和本文件里各写了一遍，现在只留这一份
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi PageUp send-keys -X page-up
bind -T copy-mode-vi PageDown send-keys -X page-down

# 缓冲区
bind b list-buffers
bind B choose-buffer
bind Delete delete-buffer

###############################################################################
# 实用功能
###############################################################################

# 清屏。
# vim-tmux-navigator 会占用无 prefix 的 C-l，shell 原本的清屏就没了，
# 这一条是它官方文档推荐的补偿绑定：把一个真正的 C-l 送给 shell。
bind C-l send-keys C-l

# 清屏并清空回滚缓冲（上面那个只是把内容滚上去，这个是真的删掉）
bind C-k send-keys -R \; clear-history \; display "已清空回滚缓冲"

bind t clock-mode
bind q display-panes

###############################################################################
# 临时禁用 tmux 键位（往嵌套 tmux 或全屏应用里透传按键）
###############################################################################
# 旧配置用 `unbind-key -a`，那是有去无回的：所有键位都没了，
# 连 prefix + r 重载都按不出来，只能到别的终端里手动 source-file。
# 这里换成公认的 key-table 开关：F12 关，再按 F12 开。
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    display "tmux 键位已关闭 (F12 恢复)" \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    display "tmux 键位已恢复" \;\
    refresh-client -S
