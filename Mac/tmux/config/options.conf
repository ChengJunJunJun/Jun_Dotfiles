# Mac/tmux/config/options.conf
# Tmux 基础选项
#
# 本文件只放 set-option。键位在 keybindings.conf，外观在 theme.conf。
# 每个选项在整份配置里只出现一次。

###############################################################################
# 终端能力
###############################################################################

# 内层 TERM 用 tmux-256color 而不是 screen-256color。
# screen-256color 的 terminfo 里没有斜体、undercurl、extended-keys、同步输出，
# nvim 的诊断波浪线和斜体注释会被静默降级。
# （已确认本机 `infocmp tmux-256color` 存在）
set -g default-terminal "tmux-256color"

# 能力用 terminal-features 声明，而不是给某个具体 TERM 打 terminal-overrides。
# 旧写法 `terminal-overrides ",xterm-256color:Tc"` 只在外层终端的 TERM 恰好是
# xterm-256color 时才命中 —— 换到 WezTerm / Ghostty / Alacritty 就静默失效。
#
# 先 -gu 复位再追加: set -as 是「追加」，prefix + r 每重载一次就会把下面五条
# 再叠一遍，重载六次列表里就有 30 条重复项。-gu 会把选项还原成 tmux 的内置
# 默认（xterm*/screen*/rxvt* 三条），而不是清空，所以复位是安全的。
set -gu terminal-features
set -as terminal-features ",*:RGB"         # 24 位真彩
set -as terminal-features ",*:usstyle"     # undercurl / 彩色下划线
set -as terminal-features ",*:hyperlinks"  # OSC 8 超链接
set -as terminal-features ",*:sync"        # 同步输出，重绘不撕裂
set -as terminal-features ",*:clipboard"   # OSC 52 剪贴板

# 允许应用把转义序列直接透传给外层终端（nvim 里的图片协议 / kitty graphics）
set -g allow-passthrough on

# 让 tmux 用 OSC 52 往系统剪贴板写，SSH 到远端时也能复制回本地
set -g set-clipboard on

###############################################################################
# 基础行为
###############################################################################

# 鼠标关闭，复制交给终端自身处理
set -g mouse off

# 已关闭 resurrect 的滚屏抓取，回滚缓冲可以放心加大
set -g history-limit 50000

# 窗口和面板索引从 1 开始
set -g base-index 1
set -g pane-base-index 1

# 关闭窗口后自动重新编号
set -g renumber-windows on

# 允许自动重命名窗口
set -g automatic-rename on

# 终端标题
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

# 杀掉当前会话时自动切到另一个会话，而不是把你踢出 tmux。
# 这一行取代了原来 scripts/kill_current_session.sh 那 25 行手工切换逻辑。
set -g detach-on-destroy off

# 多个客户端 attach 同一会话时，按当前正在操作的客户端尺寸调整而不是取最小值
setw -g aggressive-resize on

# 默认 shell 写绝对路径: tmux server 的启动环境里 $SHELL 未必有值，
# 一旦为空 tmux 会起不来，而且报错很不直观。
set -g default-shell /bin/zsh

###############################################################################
# 时间
###############################################################################

# 0 在本地无感，但 SSH / 慢终端下容易把 ESC 和后续字节切开，
# 表现为 nvim 里按 Esc 偶发被识别成 Alt 组合键。10ms 是公认的稳妥值。
set -s escape-time 10

set -g repeat-time 600
set -g display-panes-time 800
set -g display-time 1500

# 状态栏已经是纯 format（没有任何 #() 子进程），刷新很便宜。
# 会话列表由 theme.conf 里的 hook 驱动，不依赖这个间隔。
set -g status-interval 5

###############################################################################
# 原 tmux-sensible 提供、现已内联的两项
###############################################################################

# nvim 的 FocusGained / autoread / 自动保存依赖它
set -g focus-events on

# prefix + : 的命令行用 emacs 键位（vi 键位在这里只会碍事）
set -g status-keys emacs

###############################################################################
# 活动监控
###############################################################################

set -g monitor-activity on
set -g visual-activity off
set -g monitor-bell on
set -g visual-bell off

###############################################################################
# 复制模式
###############################################################################

set -g mode-keys vi
# copy-mode-vi 的具体键位统一放在 keybindings.conf，这里不重复绑定

###############################################################################
# 滚动条 (tmux 3.6+)
###############################################################################

# 只在 copy-mode 时显示
set -g pane-scrollbars modal
set -g pane-scrollbars-position right
set -g pane-scrollbars-style 'fg=green,bg=black,width=1,pad=1'

###############################################################################
# 插件选项
###############################################################################

# --- tmux-resurrect ---
#
# 这里删掉了两个原本无效的设置:
#   @resurrect-save-shell-history  当前版本的 tmux-resurrect 根本不认这个选项
#                                  （整个仓库搜不到任何引用，是旧版本移除的特性）
#   @resurrect-strategy-vim/nvim   'session' 策略只在 pane 的 cwd 下存在 Session.vim
#                                  时才会输出 `nvim -S`，而 nvim 侧没有装
#                                  vim-obsession / persistence 之类会生成该文件的插件
#
# 关闭滚屏抓取: 开着的话 continuum 每次保存都要把所有 pane 的整个回滚缓冲
# dump 到磁盘。窗口布局、工作目录、进程照常恢复，只是不还原屏幕上的旧输出。
set -g @resurrect-capture-pane-contents 'off'

# --- tmux-continuum ---
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# --- tmux-thumbs ---
# 键盘选取屏幕上的 URL / 路径 / commit hash（因为 mouse off，没有它只能靠肉眼抄）
# 用大写 F，把小写 f 留给 zoom
set -g @thumbs-key F
set -g @thumbs-osc52 1
