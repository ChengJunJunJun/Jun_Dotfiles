# Mac/tmux/config/theme.conf
# Tmux 外观 - Catppuccin Mocha
#
# 设计目标: 状态栏是纯 format，不含任何 #() —— 也就是重绘时零子进程。
# 旧实现每次重绘要跑 5 个 #() 作业（tmux-mode-indicator 展开出 4 个
# `tmux show-option`，外加会话列表脚本，脚本内部还会再 fork 2 个 tmux 客户端），
# 而 status-interval 又被设成了 1，等于每秒钟白烧一把进程。

###############################################################################
# 颜色定义 (Catppuccin Mocha)
###############################################################################
# %hidden: 只在配置解析期可见，不会泄漏到 tmux 拉起的每个 shell 环境里

%hidden thm_bg="#1e1e2e"
%hidden thm_fg="#cdd6f4"
%hidden thm_black="#181825"
%hidden thm_gray="#313244"
%hidden thm_black4="#585b70"
%hidden thm_cyan="#89dceb"
%hidden thm_blue="#89b4fa"
%hidden thm_magenta="#cba6f7"
%hidden thm_pink="#f5c2e7"
%hidden thm_red="#f38ba8"
%hidden thm_green="#a6e3a1"
%hidden thm_yellow="#f9e2af"
%hidden thm_orange="#fab387"

# scripts/sessions_status.sh 要用同一套配色生成会话列表。
# %hidden 变量只在配置解析期存在，脚本读不到，所以把它需要的几个暴露成用户选项。
set -g @thm_bg "$thm_bg"
set -g @thm_fg "$thm_fg"
set -g @thm_gray "$thm_gray"
set -g @thm_magenta "$thm_magenta"

###############################################################################
# 基本样式
###############################################################################

set -g status-style "fg=$thm_fg,bg=$thm_bg"
set -g message-style "fg=$thm_cyan,bg=$thm_gray,align=centre"
set -g message-command-style "fg=$thm_cyan,bg=$thm_gray,align=centre"
set -g mode-style "fg=$thm_pink,bg=$thm_black4"

# 面板边框
set -g pane-border-style "fg=$thm_gray"
set -g pane-active-border-style "fg=$thm_blue,bold"
set -g pane-border-format "#[fg=$thm_blue,bg=$thm_bg] #P: #{pane_current_command} "
set -g pane-border-status off

###############################################################################
# 状态栏布局
###############################################################################

set -g status on
set -g status-position bottom
set -g status-justify right
set -g status-left-length 200
set -g status-right-length 100

# 左侧 = 模式指示器 + 会话列表
#
# 模式指示器: 原来靠 MunifTanjim/tmux-mode-indicator 插件，它展开后是一坨含
# 4 个 `#(tmux show-option ...)` 的 format。下面这一行是等价的原生写法，零子进程。
# 注意每个 #[...] 里都不能出现逗号 —— 在 #{?...} 条件里逗号是分隔符，
# 所以要写成 #[fg=x]#[bg=y]#[bold] 而不是 #[fg=x,bg=y,bold]。
#
# 会话列表: #{@sessions} 是用户选项，由 scripts/sessions_status.sh 在
# 会话增/删/改名时通过下面的 hook 写入。用户选项支持会话作用域，
# 所以每个会话拿到的是各自算好的字符串，多客户端 attach 不同会话时高亮也正确。
set -g status-left "#{?client_prefix,#[fg=$thm_bg]#[bg=$thm_blue]#[bold] WAIT ,#{?pane_in_mode,#[fg=$thm_bg]#[bg=$thm_yellow]#[bold] COPY ,#{?pane_synchronized,#[fg=$thm_bg]#[bg=$thm_red]#[bold] SYNC ,#[fg=$thm_bg]#[bg=$thm_green]#[bold] TMUX }}}#[default] #{@sessions}"

set -g status-right ""

###############################################################################
# 窗口状态
###############################################################################

set -g window-status-separator ""
set -g window-status-current-format "#[fg=$thm_bg,bg=$thm_blue] #I #[fg=$thm_fg,bg=$thm_gray] #W #[fg=$thm_gray,bg=$thm_bg]"
set -g window-status-format "#[fg=$thm_fg,bg=$thm_gray] #I #[fg=$thm_fg,bg=$thm_black4] #W #[fg=$thm_black4,bg=$thm_bg]"

# 活动 / 铃声指示（旧配置把这两条各写了两遍，只有后一遍生效）
set -g window-status-activity-style "fg=$thm_red,bg=$thm_gray,bold"
set -g window-status-bell-style "fg=$thm_yellow,bg=$thm_gray,bold,blink"

###############################################################################
# 时钟
###############################################################################

set -g clock-mode-colour "$thm_blue"
set -g clock-mode-style 24

###############################################################################
# 会话列表的刷新时机
###############################################################################
# 会话列表只在会话集合变化时才需要重算，用 hook 触发即可，不需要轮询。
# 切换会话不用重算 —— 每个会话的 @sessions 都是预先算好的。

set-hook -g session-created      "run-shell -b '$TMUX_DIR/scripts/sessions_status.sh'"
set-hook -g session-closed       "run-shell -b '$TMUX_DIR/scripts/sessions_status.sh'"
set-hook -g after-rename-session "run-shell -b '$TMUX_DIR/scripts/sessions_status.sh'"

# prefix + r 重载配置时 hook 不会触发，所以这里主动跑一次
run-shell -b "$TMUX_DIR/scripts/sessions_status.sh"
