###############################################################################
# Tmux 主配置文件
# 作者: ChengJun
#
# 目录结构:
#   config/options.conf      选项 (set-option)
#   config/keybindings.conf  键位 (bind-key)
#   config/theme.conf        外观、状态栏、状态栏刷新 hook
#   scripts/                 只在按键或 hook 触发时才跑的脚本（状态栏不再有常驻子进程）
#
# 约定: 同一个选项在整个配置里只出现一次。
#       tmux 是"后写覆盖前写"且不报错的，重复设置会让人以为生效了其实没有。
###############################################################################

###############################################################################
# 路径变量
###############################################################################
# 用 %hidden 而不是裸赋值: 裸赋值会写进 tmux 的全局环境，
# 于是每个由 tmux 拉起的 shell 都会莫名其妙多出这几个变量。
%hidden TMUX_DIR="/Users/cj/Jun_Dotfiles/Mac/tmux"

###############################################################################
# 加载配置模块
###############################################################################
source "$TMUX_DIR/config/options.conf"
source "$TMUX_DIR/config/keybindings.conf"
source "$TMUX_DIR/config/theme.conf"

###############################################################################
# 插件管理
###############################################################################
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$TMUX_DIR/plugins"

# 插件列表
#
# 已移除的三个:
#   tmux-sensible        它设的东西这份配置几乎全都显式设过，剩下的价值只有
#                        focus-events 和 status-keys 两行（已内联到 options.conf）。
#                        代价却是它会静默注入 a / C-n / C-p 三个键位，
#                        让人搞不清自己的键位到底是谁绑的。
#   tmux-online-status   它唯一的工作是把 status-left/right 里的 #{online_status}
#                        替换成图标脚本，而这份配置从没引用过那个占位符。装了等于没装。
#   tmux-mode-indicator  功能等价于 theme.conf 里那一行原生 format，
#                        但它展开后会往 status-left 塞 4 个 #(tmux show-option)，
#                        是旧状态栏每秒 fork 子进程的主要来源。
#
# 注意: tmux-continuum 必须放在列表最后（它要在其余插件之后接管自动保存）。
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "christoomey/vim-tmux-navigator"
set -g @plugin "fcsonline/tmux-thumbs"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"

# 初始化插件管理器 (保持在文件末尾)
# tpm 在这里运行，意味着插件的键位会覆盖 keybindings.conf ——
# vim-tmux-navigator 的 C-hjkl 正是靠这一点生效的。
run "$TMUX_DIR/plugins/tpm/tpm"
